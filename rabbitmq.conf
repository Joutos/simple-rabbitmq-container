# Portas usadas pelo protocolo AMQP e pelo painel de gerenciamento.
listeners.tcp.default = 5672
management.tcp.port = 15672

# Parâmetros de conexão. O heartbeat ajuda a detectar clientes que perderam a
# conexão; channel_max limita o número de canais por conexão.
heartbeat = 60
channel_max = 2048

# Limites de segurança para evitar que o nó consuma toda a memória ou o disco
# do host. Ajuste os valores conforme os recursos disponíveis.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Fecha o canal quando uma entrega não é confirmada em 5 minutos (milissegundos).
# Ajuste ao tempo de processamento dos clientes; valores abaixo de 1 minuto
# não são suportados. A verificação ocorre periodicamente, não em tempo exato.
consumer_timeout = 300000

# O log é gravado no volume montado em ./rabbitmq-log. O nível info mantém os
# eventos operacionais úteis sem produzir o volume de mensagens em debug.
log.console = false
log.file = /var/log/rabbitmq/rabbit@rabbitmq.log
log.file.level = info
# Rotação a cada 10 MiB, com até 5 arquivos anteriores.
log.file.rotation.size = 10485760
log.file.rotation.count = 5

# O painel calcula métricas agregadas, reduzindo o custo de coleta em ambientes
# com muitas filas e conexões.
management.rates_mode = basic
